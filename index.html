<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reuters / Bloomberg RSS Resource Pool</title>
  <style>
    body{font:16px/1.6 system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#17212b}
    h1{line-height:1.2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
    a{color:#075ccf}.card{border:1px solid #dce3ea;border-radius:10px;padding:16px;background:#fbfdff}
    code{background:#eef3f8;padding:2px 5px;border-radius:4px}.muted{color:#5d6975}
    form{display:flex;gap:8px;margin:22px 0}input{flex:1;padding:11px;border:1px solid #b8c4d0;border-radius:8px;font-size:16px}
    button{padding:10px 18px;border:0;border-radius:8px;background:#075ccf;color:white;cursor:pointer}
    #results article{border-bottom:1px solid #e4e9ee;padding:12px 0}#results small{color:#5d6975}
  </style>
</head>
<body>
  <h1>Reuters / Bloomberg RSS Resource Pool</h1>
  <p class="muted">带来源证据、正文状态和分类置信度的聚合 RSS。</p>
  <form id="search"><input id="q" placeholder="搜索 RBI、Bitcoin、India……" required><button>搜索</button></form>
  <p id="status" class="muted"></p><section id="results"></section>
  <div class="grid">
    <div class="card"><b>源站稿件</b><br><a href="data/wire_original.xml">wire_original.xml</a></div>
    <div class="card"><b>明确转载稿</b><br><a href="data/wire_syndication.xml">wire_syndication.xml</a></div>
    <div class="card"><b>引用后改写</b><br><a href="data/wire_attribution.xml">wire_attribution.xml</a></div>
    <div class="card"><b>待核验发现</b><br><a href="data/discovery_candidates.xml">discovery_candidates.xml</a></div>
    <div class="card"><b>带正文条目</b><br><a href="data/fulltext.xml">fulltext.xml</a></div>
    <div class="card"><b>已核验全集</b><br><a href="data/verified_all.xml">verified_all.xml</a></div>
    <div class="card"><b>标题去重</b><br><a href="data/deduplicated.xml">deduplicated.xml</a></div>
    <div class="card"><b>OPML</b><br><a href="data/resource_pool.opml">resource_pool.opml</a></div>
    <div class="card"><b>JSON 数据池</b><br><a href="data/resource_pool.json">resource_pool.json</a></div>
  </div>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    document.querySelector('#search').addEventListener('submit',async e=>{
      e.preventDefault(); const q=document.querySelector('#q').value.trim(); if(!q)return;
      const status=document.querySelector('#status'), box=document.querySelector('#results');
      status.textContent='正在搜索本地资源池…'; box.innerHTML='';
      try{
        const r=await fetch('/api/search?mode=all&limit=50&q='+encodeURIComponent(q)); const j=await r.json();
        status.textContent=`返回 ${j.returned} 条；动态RSS：/rss/search.xml?q=${q}`;
        box.innerHTML=j.items.map(x=>`<article><a href="${esc(x.link)}" target="_blank" rel="noopener"><b>${esc(x.title)}</b></a><br><small>${esc(x.publisher||'待核验')} · ${esc(x.platform)} · ${esc(x.classification)}</small><p>${esc((x.summary||'').slice(0,260))}</p></article>`).join('');
      }catch(err){status.textContent='请求错误：'+err}
    });
  </script>
</body>
</html>
